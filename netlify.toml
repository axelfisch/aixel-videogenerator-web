[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Le cockpit (index.html/app.js/styles.css) reste un site 100% statique, sans étape de build,
# décisions en localStorage — inchangé depuis V0.
#
# V3 (§8.10 Production Router) ajoute deux fonctions serveur pour le connecteur de génération
# d'images (Images tests → Replicate, modèle FLUX.1 [schnell]) : netlify/functions/generate-image.js
# et generate-image-status.js. Elles ont besoin d'une variable d'environnement REPLICATE_API_TOKEN
# — à ajouter dans Site settings → Environment variables sur app.netlify.com (jamais dans ce dépôt).
# Sans elle, le bouton "Générer une image test" reste utilisable mais échoue avec un message clair.
#
# V3.5 (§8.10 Production Router) ajoute deux fonctions serveur pour le connecteur vidéo (Production
# → Replicate, modèle Wan 2.1 image→vidéo 480p) : netlify/functions/generate-video.js et
# generate-video-status.js. Même variable d'environnement REPLICATE_API_TOKEN — aucune nouvelle
# variable à ajouter puisque c'est le même compte/jeton Replicate que pour les images tests.
